syntax = "proto3";

// Names and code values follow RTCA DO-260B (1090 MHz Extended Squitter, ADS-B
// version 2). Values are carried in engineering units, not in the encodings of
// the messages they came from, each with the instant it was reported. Field
// numbers left free within a group are for the values of that group not
// carried yet.
//
// An instant is milliseconds since the Unix epoch: when the batch of messages
// that carried the report was heard. A report keeps its instant in every
// snapshot that carries it, and is carried for a minute after it at most. A
// value derived from others is reported when the oldest of them was.
package papaquebec.feed.v2;

// Every frame of a session travels on its one unidirectional stream, each after
// its length as a varint. The first is a Hello; snapshots follow, and the
// weather whenever it changes.
message Frame {
  oneof body {
    Snapshot snapshot = 1;
    Hello hello = 2;
    Weather weather = 3;
  }
}

// What a session needs before the first snapshot.
message Hello {
  Receiver receiver = 1;
  // The snapshots after the one the session asked to resume from and before the
  // latest, which follows in full, oldest first: one every 8 s for up to an hour,
  // each aircraft whole.
  repeated Snapshot history = 2;
}

// The receiver's own position, when it knows it.
message Receiver {
  optional double lat_deg = 1;
  optional double lon_deg = 2;
}

// The current reports of the stations around the receiver, all of them, every
// time; none when no station in range has a current report.
message Weather {
  repeated Qnh qnh = 1;
}

// The altimeter setting a station reported, and when.
message Qnh {
  // ICAO identifier.
  string station = 1;
  double lat_deg = 2;
  double lon_deg = 3;
  // When it was observed.
  uint64 observed_ms = 4 [jstype = JS_NUMBER];
  // Rounded to a hundredth.
  double qnh_in_hg = 5;
}

// Every aircraft the receiver knows at one instant.
message Snapshot {
  // It rises from one snapshot to the next.
  uint64 now_ms = 1 [jstype = JS_NUMBER];
  // Messages the receiver has decoded since it started.
  uint64 messages = 2;
  repeated Aircraft aircraft = 3;
}

// A value, and when it was reported.
message Int {
  sint32 value = 1;
  uint64 heard_ms = 2 [jstype = JS_NUMBER];
}

message Real {
  double value = 1;
  uint64 heard_ms = 2 [jstype = JS_NUMBER];
}

message Flag {
  bool value = 1;
  uint64 heard_ms = 2 [jstype = JS_NUMBER];
}

// A field is absent when it was never reported, or when its report has lapsed.
// What one message reports at once is grouped, with one instant.
message Aircraft {
  Address address = 1;
  Reception reception = 2;
  Identification identification = 3;
  Position position = 4;
  Modes modes = 5;
  Advisory advisory = 6;

  // Aircraft Status message, and surveillance replies.
  // The 12-bit Mode A code; its four octal digits are the squawk.
  Int mode_a_code = 10;
  Emergency emergency = 11;
  // The special position identification, as last reported: the crew pressed
  // IDENT, which the transponder signals for 18 s.
  Flag ident = 12;
  // True on the ground, false reported in the air.
  Flag on_ground = 13;

  // Pressure altitude, referenced to 1013.25 hPa; and the GNSS height above
  // the WGS-84 ellipsoid, reported or worked out from the pressure altitude
  // and the difference a velocity message gives.
  Int baro_altitude_ft = 20;
  Int geometric_altitude_ft = 21;

  // Velocity: the Airborne Velocity and Surface Position messages, and the
  // Comm-B track and turn and heading and speed reports, which mark each
  // value available on its own.
  Real ground_speed_kt = 30;
  // True track over the ground.
  Real track_deg = 31;
  // The velocity message carries one vertical rate and says which:
  // barometric, or geometric, from GNSS or inertial reference.
  Int baro_vertical_rate_fpm = 32;
  Int geometric_vertical_rate_fpm = 33;
  Real indicated_airspeed_kt = 34;
  Real true_airspeed_kt = 35;
  Real mach = 36;
  Real magnetic_heading_deg = 37;
  // Positive to the right.
  Real roll_deg = 38;
  Real track_rate_deg_per_s = 39;

  // Target State and Status message, or the Comm-B selected vertical
  // intention register.
  // Selected on the mode control panel or flight control unit.
  Int selected_altitude_mcp_ft = 40;
  // Selected by the flight management system.
  Int selected_altitude_fms_ft = 41;
  // DO-260B leaves true or magnetic undefined.
  Real selected_heading_deg = 42;
  // QNH or QFE, as the crew set it.
  Real baro_setting_hpa = 43;

  // Navigation Accuracy Category for position, 0 to 11, from the Operational
  // Status and Target State and Status messages.
  Int nac_p = 50;

  // Not ADS-B: derived by the receiver from the speeds.
  Real wind_speed_kt = 60;
  // True, the direction the wind blows from.
  Real wind_dir_deg = 61;
  // Outside and total air temperature.
  Real oat_c = 62;
  Real tat_c = 63;

  Registry registry = 70;
}

message Address {
  // The 24 bits of the address field.
  fixed32 value = 1;
  AddressType type = 2;
}

enum AddressType {
  ADDRESS_TYPE_UNSPECIFIED = 0;
  // The aircraft address ICAO assigned.
  ADDRESS_TYPE_ICAO = 1;
  // Anonymous, ground vehicle, fixed obstruction or TIS-B track file.
  ADDRESS_TYPE_NON_ICAO = 2;
}

// Not ADS-B: what the receiver observed of the aircraft's transmissions.
message Reception {
  uint64 messages = 1;
  optional double rssi_dbfs = 2;
  // When the last message of any kind was heard.
  uint64 heard_ms = 3 [jstype = JS_NUMBER];
}

// Aircraft Identification and Category message, or the Comm-B identification
// register, which carries the callsign alone.
message Identification {
  // Up to eight characters, trailing spaces removed.
  optional string callsign = 1;
  optional EmitterCategory emitter_category = 2;
  // When the callsign or the category was last reported.
  uint64 heard_ms = 3 [jstype = JS_NUMBER];
}

// Category set and code, numbered `set * 8 + code` with set A = 0 to D = 3.
// Set C is named as in DO-260B; ICAO Doc 9871 assigns its codes differently.
enum EmitterCategory {
  // A0: no emitter category information.
  EMITTER_CATEGORY_UNSPECIFIED = 0;
  // Below 15 500 lb.
  EMITTER_CATEGORY_A1_LIGHT = 1;
  // 15 500 lb to below 75 000 lb.
  EMITTER_CATEGORY_A2_SMALL = 2;
  // 75 000 lb to below 300 000 lb.
  EMITTER_CATEGORY_A3_LARGE = 3;
  // A large aircraft with a strong wake, such as the Boeing 757.
  EMITTER_CATEGORY_A4_HIGH_VORTEX_LARGE = 4;
  // 300 000 lb and above.
  EMITTER_CATEGORY_A5_HEAVY = 5;
  // Above 5 g and above 400 kt.
  EMITTER_CATEGORY_A6_HIGH_PERFORMANCE = 6;
  EMITTER_CATEGORY_A7_ROTORCRAFT = 7;
  EMITTER_CATEGORY_B0_NO_INFORMATION = 8;
  EMITTER_CATEGORY_B1_GLIDER = 9;
  EMITTER_CATEGORY_B2_LIGHTER_THAN_AIR = 10;
  EMITTER_CATEGORY_B3_PARACHUTIST = 11;
  EMITTER_CATEGORY_B4_ULTRALIGHT = 12;
  EMITTER_CATEGORY_B5_RESERVED = 13;
  EMITTER_CATEGORY_B6_UNMANNED = 14;
  EMITTER_CATEGORY_B7_SPACE_VEHICLE = 15;
  EMITTER_CATEGORY_C0_NO_INFORMATION = 16;
  EMITTER_CATEGORY_C1_SURFACE_EMERGENCY_VEHICLE = 17;
  EMITTER_CATEGORY_C2_SURFACE_SERVICE_VEHICLE = 18;
  EMITTER_CATEGORY_C3_POINT_OBSTACLE = 19;
  EMITTER_CATEGORY_C4_CLUSTER_OBSTACLE = 20;
  EMITTER_CATEGORY_C5_LINE_OBSTACLE = 21;
  EMITTER_CATEGORY_C6_RESERVED = 22;
  EMITTER_CATEGORY_C7_RESERVED = 23;
  EMITTER_CATEGORY_D0_RESERVED = 24;
  EMITTER_CATEGORY_D1_RESERVED = 25;
  EMITTER_CATEGORY_D2_RESERVED = 26;
  EMITTER_CATEGORY_D3_RESERVED = 27;
  EMITTER_CATEGORY_D4_RESERVED = 28;
  EMITTER_CATEGORY_D5_RESERVED = 29;
  EMITTER_CATEGORY_D6_RESERVED = 30;
  EMITTER_CATEGORY_D7_RESERVED = 31;
}

// Airborne or Surface Position message: one fix.
message Position {
  double lat_deg = 1;
  double lon_deg = 2;
  Source source = 3;
  // Navigation Integrity Category, 0 to 11.
  uint32 nic = 4;
  // The radius of containment the category stands for, in metres; absent
  // when unknown.
  optional uint32 rc_m = 5;
  uint64 heard_ms = 6 [jstype = JS_NUMBER];
}

// Where a position came from, when not from the aircraft's own broadcast.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  // Traffic Information Service, a ground station broadcasting radar tracks.
  SOURCE_TISB = 4;
  // Multilateration by several ground receivers; never broadcast.
  SOURCE_MLAT = 5;
}

// The autopilot modes, from the Target State and Status message or the Comm-B
// selected vertical intention register, which reports only vnav, altitude_hold
// and approach. Present and all false when the aircraft reports that none is
// engaged.
message Modes {
  bool autopilot = 1;
  bool vnav = 2;
  bool altitude_hold = 3;
  bool approach = 4;
  bool lnav = 5;
  bool tcas = 6;
  uint64 heard_ms = 7 [jstype = JS_NUMBER];
}

// Emergency/priority status, from the Aircraft Status message.
message Emergency {
  EmergencyPriorityStatus status = 1;
  uint64 heard_ms = 2 [jstype = JS_NUMBER];
}

// Numbered as the Emergency/Priority Status subfield encodes them.
enum EmergencyPriorityStatus {
  EMERGENCY_PRIORITY_STATUS_NO_EMERGENCY = 0;
  EMERGENCY_PRIORITY_STATUS_GENERAL_EMERGENCY = 1;
  EMERGENCY_PRIORITY_STATUS_LIFEGUARD_MEDICAL = 2;
  EMERGENCY_PRIORITY_STATUS_MINIMUM_FUEL = 3;
  EMERGENCY_PRIORITY_STATUS_NO_COMMUNICATIONS = 4;
  EMERGENCY_PRIORITY_STATUS_UNLAWFUL_INTERFERENCE = 5;
  EMERGENCY_PRIORITY_STATUS_DOWNED_AIRCRAFT = 6;
  EMERGENCY_PRIORITY_STATUS_RESERVED = 7;
}

// Active resolution advisory, from the TCAS RA broadcast of the Aircraft Status
// message or the Comm-B ACAS register: what the crew is told, as ICAO Annex 10
// Volume IV lays the ARA subfield out.
message Advisory {
  // Several threats at once.
  bool multiple_threats = 1;
  // What is advised, when the threats call for one sense.
  Resolution resolution = 2;
  // What is called for when several threats call for different senses.
  Corrections corrections = 3;
  // The advisory has ended; it is still reported for 18 s.
  bool terminated = 4;
  uint64 heard_ms = 7 [jstype = JS_NUMBER];

  message Resolution {
    // Corrective, else preventive.
    bool corrective = 1;
    // Downward, else upward.
    bool downward = 2;
    bool increased_rate = 3;
    bool sense_reversal = 4;
    bool altitude_crossing = 5;
    // A climb or a descent, else a limit on the vertical speed.
    bool positive = 6;
  }

  message Corrections {
    bool upward = 1;
    bool positive_climb = 2;
    bool downward = 3;
    bool positive_descent = 4;
    bool crossing = 5;
    bool sense_reversal = 6;
  }
}

// Not ADS-B: looked up from an aircraft database by the address.
message Registry {
  optional string registration = 1;
  // ICAO Doc 8643 designator.
  optional string type_designator = 2;
  optional string type_description = 3;
}
