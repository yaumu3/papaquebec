name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: scope
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scope/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: mise run check:scope

  server:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: mise run check:server

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # The Dockerfile's cache mounts, kept between runs so a build compiles only what changed.
      - uses: actions/cache@v6
        id: mounts
        with:
          path: cache-mount
          key: mounts-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Cargo.lock', 'scope/bun.lock') }}
          restore-keys: mounts-${{ runner.os }}-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
