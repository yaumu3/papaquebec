[package]
name = "feeder"
description = "Feeds the scope with aircraft data over WebTransport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
serde = "1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
