[tools]
bun = "1.4"
rust = { version = "1.98", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"

[tasks."dev:web"]
description = "The server, over plain http for the dev server to pass requests on to"
dir = "scope"
env = { PQ_ADDRESS = "http://:8080" }
run = "cargo run"

[tasks."dev:scope"]
description = "The scope's dev server"
depends = ["wasm"]
dir = "scope"
run = "bun run dev"

[tasks.dev]
description = "The scope and its server, following the receiver at PQ_BEAST that hears at PQ_SITE"
depends = ["dev:web", "dev:scope"]

[tasks.sim]
description = "The scope and its server flying the synthetic fleet around PQ_SITE (RJTT by default)"
run = 'PQ_SIM="${PQ_SITE:-35.5533,139.7811}" mise run dev'

[tasks."check:server"]
description = "The checks of the server's crates, as CI runs them"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
]

[tasks."check:scope"]
description = "The scope's checks, as CI runs them"
depends = ["wasm"]
dir = "scope"
run = ["bun run format:check", "bun run lint", "bun run test", "bun run build"]

[tasks.check]
description = "Every check CI runs"
depends = ["check:server", "check:scope"]

[tasks.bench]
description = "Load test the scope with the sim's extra traffic; flags follow"
dir = "scope"
run = "bun run bench"

[tasks."bench:blocks"]
description = "Score the data block placer on the sim's scenarios against the greedy baseline; --check for the thresholds"
run = "cargo run -q --release -p sim --bin bench --"

[tasks.wasm]
description = "The placer and the magnetic model as WebAssembly for the scope, with their bindings, into scope/src/render/layout/wasm and scope/src/lib/wasm"
sources = ["crates/placer/**/*", "crates/wmm/**/*", "Cargo.lock"]
outputs = ["scope/src/render/layout/wasm/placer_bg.wasm", "scope/src/lib/wasm/wmm_bg.wasm"]
run = [
  '''
  lock=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
  [ "$(wasm-bindgen --version)" = "wasm-bindgen $lock" ] || { echo "wasm-bindgen-cli must be $lock, as Cargo.lock has it; pin that in mise.toml" >&2; exit 1; }
  ''',
  "cargo build -q --profile wasm -p placer -p wmm --target wasm32-unknown-unknown",
  "wasm-bindgen --target web --out-dir scope/src/render/layout/wasm target/wasm32-unknown-unknown/wasm/placer.wasm",
  "wasm-bindgen --target web --out-dir scope/src/lib/wasm target/wasm32-unknown-unknown/wasm/wmm.wasm",
]
