[package]
name = "placer"
description = "Places data blocks by simulated annealing, in the scope as WebAssembly and in the benchmark natively"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Not the workspace's lints: wasm-bindgen's exports are unsafe attributes, which the workspace forbids.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# Exact: the wasm-bindgen CLI must be this version too, so mise pins it and the image reads it from the lock.
wasm-bindgen = "=0.2.129"
