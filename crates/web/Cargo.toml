[package]
name = "web"
description = "Serves the scope and its feed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "papaquebec"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
authority = { path = "../authority" }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "http2",
  "json",
  "tokio",
] }
feeder = { path = "../feeder" }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sim = { version = "0.1.0", path = "../sim" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.6.11", features = ["fs", "compression-gzip"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
