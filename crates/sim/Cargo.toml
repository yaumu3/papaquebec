[package]
name = "sim"
description = "Stands in for a receiver with synthesized traffic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
placer = { path = "../placer" }
tokio = { version = "1.53.1", features = ["net", "time", "io-util", "macros"] }
tracker = { path = "../tracker" }
wmm = { path = "../wmm" }

[dev-dependencies]
feeder = { path = "../feeder" }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "sync"] }
