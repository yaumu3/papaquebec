[package]
name = "feeder"
description = "Feeds the scope with aircraft data over WebTransport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "io-util"] }
tracker = { path = "../tracker" }
url = "2.5.8"
wtransport = { version = "0.7.2", features = ["self-signed"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "test-util"] }
