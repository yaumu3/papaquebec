[package]
name = "feeder"
description = "Feeds the scope with aircraft data over WebTransport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "io-util"] }
url = "2.5.8"
wtransport = { version = "0.7.2", features = ["self-signed"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "test-util"] }
