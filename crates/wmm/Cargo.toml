[package]
name = "wmm"
description = "The World Magnetic Model: how far magnetic north lies from true north, by NOAA's WMM2025; in the feeder natively and in the scope as WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Not the workspace's lints: wasm-bindgen's exports are unsafe attributes, which the workspace forbids.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exact: the wasm-bindgen CLI must be this version too, so mise pins it and the image reads it from the lock.
wasm-bindgen = "=0.2.129"
