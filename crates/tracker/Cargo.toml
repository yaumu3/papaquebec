[package]
name = "tracker"
description = "Reads the messages a receiver hears and keeps track of each aircraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
wmm = { path = "../wmm" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.9.1"
