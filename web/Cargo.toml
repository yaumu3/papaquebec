[package]
name = "web"
description = "Serves the scope and its feed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "papaquebec"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "http2",
  "json",
  "tokio",
] }
feeder = { path = "../feeder" }
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.6.11", features = ["fs", "compression-gzip"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
